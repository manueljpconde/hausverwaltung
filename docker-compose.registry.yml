# HaVeWa — Produktion mit vorgebautem Image aus der GitHub Container Registry.
# Start:  docker compose -f docker-compose.registry.yml pull
#         docker compose -f docker-compose.registry.yml up -d
# Erwartet eine .env-Datei daneben (siehe .env.prod.example).
# Alternative ohne Registry: docker-compose.prod.yml (baut lokal).
# Image-Tag MUSS in .env gepinnt sein (HAVEWA_TAG=sha-…); Update: deploy/update.sh <tag>
services:
  app:
    image: "${HAVEWA_IMAGE:-ghcr.io/manueljpconde/hausverwaltung}:${HAVEWA_TAG:?HAVEWA_TAG in .env setzen, z. B. sha-abc1234}"
    container_name: havewa-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://havewa:${DB_PASSWORD}@db:5432/havewa?schema=public"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_TRUST_HOST: "true"
      # Öffentliche URL: hinter dem Proxy sieht Auth.js sonst localhost:3000 und leitet
      # z. B. nach dem Logout dorthin um (#10).
      AUTH_URL: "https://${DOMAIN}"
      # Optionaler Bootstrap beim ersten Start (alle optional):
      SEED_DEMO: "${SEED_DEMO:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-}"
      TENANT_NAME: "${TENANT_NAME:-}"
      # Optionales OIDC/SSO:
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_NAME: "${OIDC_NAME:-}"
    expose:
      - "3000"
    volumes:
      - havewa-storage:/app/storage

  caddy:
    image: caddy:2-alpine
    container_name: havewa-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    image: postgres:16-alpine
    container_name: havewa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: havewa
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: havewa
    volumes:
      - havewa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havewa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  havewa-db:
  havewa-storage:
  caddy-data:
  caddy-config:
